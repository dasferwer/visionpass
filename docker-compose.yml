services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: visionpass
      POSTGRES_USER: visionpass
      POSTGRES_PASSWORD: visionpass
    volumes:
      - visionpass_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionpass -d visionpass"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: visionpass
      RABBITMQ_DEFAULT_PASS: visionpass
    volumes:
      - visionpass_rabbitmq:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${VISIONPASS_RABBITMQ_MANAGEMENT_PORT:-15685}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    build:
      context: .
      target: ${VISIONPASS_BUILD_TARGET:-runtime}
    environment: &visionpass-environment
      VISIONPASS_DATABASE_URL: ${VISIONPASS_DATABASE_URL:-postgresql+psycopg://visionpass:visionpass@database:5432/visionpass}
      VISIONPASS_RABBITMQ_URL: ${VISIONPASS_RABBITMQ_URL:-amqp://visionpass:visionpass@rabbitmq:5672/%2F}
      VISIONPASS_JWT_SECRET: ${VISIONPASS_JWT_SECRET:-local-visionpass-secret-change-me-at-least-32-bytes}
      VISIONPASS_ENCRYPTION_KEY: ${VISIONPASS_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      VISIONPASS_ADMIN_EMAIL: ${VISIONPASS_ADMIN_EMAIL:-admin@example.com}
      VISIONPASS_ADMIN_PASSWORD: ${VISIONPASS_ADMIN_PASSWORD:-ChangeMe123!}
      VISIONPASS_REVIEWER_EMAIL: ${VISIONPASS_REVIEWER_EMAIL:-reviewer@example.com}
      VISIONPASS_REVIEWER_PASSWORD: ${VISIONPASS_REVIEWER_PASSWORD:-ChangeMe123!}
      VISIONPASS_MATCHER_BACKEND: ${VISIONPASS_MATCHER_BACKEND:-stub}
      VISIONPASS_MATCH_THRESHOLD: ${VISIONPASS_MATCH_THRESHOLD:-0.60}
      VISIONPASS_REVIEW_MARGIN: ${VISIONPASS_REVIEW_MARGIN:-0.12}
      VISIONPASS_MAX_IMAGE_BYTES: ${VISIONPASS_MAX_IMAGE_BYTES:-5242880}
      VISIONPASS_LOG_LEVEL: ${VISIONPASS_LOG_LEVEL:-INFO}
    command: ["sh", "-c", "alembic upgrade head && python -m visionpass.seed"]
    depends_on:
      database:
        condition: service_healthy

  api:
    build:
      context: .
      target: ${VISIONPASS_BUILD_TARGET:-runtime}
    environment: *visionpass-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:${VISIONPASS_PORT:-8050}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  outbox-publisher:
    build:
      context: .
      target: ${VISIONPASS_BUILD_TARGET:-runtime}
    environment: *visionpass-environment
    command: ["python", "-m", "visionpass.workers.publisher"]
    depends_on:
      api:
        condition: service_healthy

  enrollment-worker:
    build:
      context: .
      target: ${VISIONPASS_BUILD_TARGET:-runtime}
    environment: *visionpass-environment
    command: ["python", "-m", "visionpass.workers.enrollment"]
    depends_on:
      api:
        condition: service_healthy

  privacy-worker:
    build:
      context: .
      target: ${VISIONPASS_BUILD_TARGET:-runtime}
    environment: *visionpass-environment
    command: ["python", "-m", "visionpass.workers.privacy"]
    depends_on:
      api:
        condition: service_healthy

  database-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: visionpass_test
      POSTGRES_USER: visionpass
      POSTGRES_PASSWORD: visionpass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionpass -d visionpass_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  rabbitmq-test:
    image: rabbitmq:4-alpine
    profiles: ["test"]
    environment:
      RABBITMQ_DEFAULT_USER: visionpass
      RABBITMQ_DEFAULT_PASS: visionpass
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30

  test:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      VISIONPASS_DATABASE_URL: postgresql+psycopg://visionpass:visionpass@database-test:5432/visionpass_test
      VISIONPASS_RABBITMQ_URL: amqp://visionpass:visionpass@rabbitmq-test:5672/%2F
      VISIONPASS_JWT_SECRET: test-visionpass-secret-at-least-32-bytes-long
      VISIONPASS_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      VISIONPASS_ADMIN_EMAIL: admin-test@example.com
      VISIONPASS_ADMIN_PASSWORD: TestAdmin123!
      VISIONPASS_REVIEWER_EMAIL: reviewer-test@example.com
      VISIONPASS_REVIEWER_PASSWORD: TestReviewer123!
      VISIONPASS_MATCHER_BACKEND: stub
    depends_on:
      database-test:
        condition: service_healthy
      rabbitmq-test:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python -m visionpass.seed && pytest"]

volumes:
  visionpass_postgres:
  visionpass_rabbitmq:
